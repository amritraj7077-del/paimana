[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from "/"
  to = "/.netlify/functions/api/"
  status = 200

[[redirects]]
  from "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[dev]
  command = "python -m src.dashboard.app"
  targetPort = 5000
  autoLaunch = false
